<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Media Play / Stream Hexagon Base -->
  <polygon points="256,100 376,170 376,310 256,380 136,310 136,170" fill="#0f172a" stroke="#38bdf8" stroke-width="12" filter="url(#glow)" />

  <!-- Segment Wave Bars (HLS / DASH segments) -->
  <rect x="180" y="270" width="18" height="40" rx="9" fill="#38bdf8" opacity="0.9" />
  <rect x="210" y="240" width="18" height="70" rx="9" fill="#38bdf8" />
  <rect x="240" y="210" width="18" height="100" rx="9" fill="url(#accentGrad)" />
  <rect x="270" y="230" width="18" height="80" rx="9" fill="#22c55e" />
  <rect x="300" y="260" width="18" height="50" rx="9" fill="#22c55e" opacity="0.9" />

  <!-- Download Arrow overlay -->
  <g transform="translate(256, 210)">
    <!-- Down Arrow Stem -->
    <path d="M-16,-60 L16,-60 L16,0 L36,0 L0,44 L-36,0 L-16,0 Z" fill="url(#arrowGrad)" />
  </g>

  <!-- Android style bottom tray / cradle -->
  <path d="M190,345 L322,345" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <circle cx="256" cy="345" r="4" fill="#22c55e" />

  <!-- Tag badge text -->
  <rect x="176" y="405" width="160" height="34" rx="17" fill="#0284c7" />
  <text x="256" y="428" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">N_m3u8DL-RE</text>
</svg>
